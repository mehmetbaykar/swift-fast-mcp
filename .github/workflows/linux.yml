name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: swift build + swift test (no traits)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: toolkit-leak grep-gate
        # docs/08 §verify: swift-mcp-toolkit must not be referenced by
        # Package.swift / Package.resolved or by any `import` / `@Schemable`
        # usage in Sources/Tests. Attribution comments in Apache-2.0 license
        # notes are fine and not matched by these patterns.
        run: |
          ! grep -E "swift-mcp-toolkit|MCPToolkit" Package.swift Package.resolved
          ! grep -rE "^[[:space:]]*import[[:space:]]+MCPToolkit|@Schemable" Sources Tests
      - name: swift build
        run: swift build
      - name: swift build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: swift test
        run: swift test
