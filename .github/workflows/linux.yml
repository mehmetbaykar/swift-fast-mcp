name: Linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build + swift test (no traits)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v6
      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: toolkit-leak grep-gate
        # swift-mcp-toolkit must not be referenced by Package.swift /
        # Package.resolved or by any `import` / `@Schemable` usage in
        # Sources/Tests. Attribution comments are fine and not matched.
        run: |
          ! grep -E "swift-mcp-toolkit|MCPToolkit" Package.swift Package.resolved
          ! grep -rE "^[[:space:]]*import[[:space:]]+MCPToolkit|@Schemable" Sources Tests
      - name: swift build
        run: swift build
      - name: swift build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: swift test
        run: swift test
