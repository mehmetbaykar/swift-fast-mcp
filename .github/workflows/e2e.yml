name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspector-e2e:
    name: MCP Inspector E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
      fail-fast: false
    # `MCP_INSPECTOR_E2E` intentionally NOT set: the test gates on it and
    # skips when absent. The inspector subprocess deadlocks on the 64 KB
    # `Pipe`/`waitUntilExit()` buffer when run on slow CI runners. Run
    # locally with `MCP_INSPECTOR_E2E=1 swift test --filter
    # McpInspectorIntegrationTests`.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.swiftpm
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-e2e-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: swiftpm-e2e-${{ runner.os }}-
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: swift --version
      - run: swift test --filter McpInspectorIntegrationTests
